# TerraMind — run the full stack on any machine with Docker installed.
#
# Quick start (Docker Desktop): see docker/QUICKSTART.md
#
#   docker compose up --build
#   open https://terramind-llm.com   (or http://localhost:3000 for local testing)
#
# Optional .env at repo root (secrets never committed):
#   copy .env.example .env
#
# Real RAG (after you have a key): init-indexes once, then up --build
#
# Full explanation: docker/README.md

name: terramind

services:
  # --- 1. Model API (RAG + routing) — internal only, not exposed to internet ---
  model-api:
    image: terramind-model-api:local
    build:
      context: .
      dockerfile: docker/model-api/Dockerfile
    expose:
      - "8001"
    # No OPENAI_API_KEY here on purpose: every query carries the visitor's own key
    # (X-OpenAI-Key) and the model API refuses to fall back to a server key.
    volumes:
      - vectorstore:/app/vectorstore
      - ./data:/app/data:ro
    restart: unless-stopped

  # --- 2. Gateway (web API) — internal only, not exposed to internet ---
  gateway:
    image: terramind-gateway:local
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      RAG_SERVICE_URL: http://model-api:8001/query
      USE_MOCK: ${USE_MOCK:-false}
    depends_on:
      model-api:
        condition: service_healthy
    restart: unless-stopped

  # --- 3. Frontend (production React build + nginx) ---
  # nginx serves static files and proxies /api/* → gateway internally.
  # Bound to localhost only — Caddy handles all public traffic.
  frontend:
    image: terramind-frontend:local
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # --- 4. Caddy (reverse proxy + automatic HTTPS via Let's Encrypt) ---
  # Edit docker/caddy/Caddyfile: replace "your-domain.com" with your real domain.
  # For local testing without a domain, set the Caddyfile site address to ":80".
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # --- One-shot: build Chroma indexes (run once, or after data changes) ---
  # Same image as model-api — Compose builds once, init reuses cached layers.
  # The only service that uses a server-side OPENAI_API_KEY (to embed the corpus).
  # Pass it just for this run instead of keeping it in .env:
  #   OPENAI_API_KEY=sk-... docker compose --profile init run --rm init-indexes
  #
  #   docker compose build model-api
  #   docker compose --profile init run --rm init-indexes
  init-indexes:
    profiles: ["init"]
    image: terramind-model-api:local
    build:
      context: .
      dockerfile: docker/model-api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - vectorstore:/app/vectorstore
      - ./data:/app/data:ro
    command:
      - sh
      - -c
      - |
        python -m core.rag.product.cli --reset
        python -m core.rag.general.cli --reset
        echo 'Indexes ready in volume vectorstore'

volumes:
  vectorstore:
    name: terramind-vectorstore
  caddy_data:
  caddy_config:
