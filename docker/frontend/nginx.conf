# Rate-limit zone: 20 requests/minute per client IP, 10MB shared memory.
# Applied to /api/* only — static assets are unlimited.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Caddy, $remote_addr is Caddy's container IP. Trust X-Real-IP from Docker's
    # private networks so the rate limit keys on the real visitor. Safe because this
    # container is only published on 127.0.0.1 (see docker-compose.yml).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    # Docker embedded DNS — resolve service names at request time, not nginx startup.
    # Prevents "host not found in upstream gateway" when gateway starts after frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Browser security headers (inherited by both locations below; neither sets its own).
    # The CSP only allows this site's own scripts and requests, so injected content
    # can neither run code nor send a visitor's API key to another host.
    # 'unsafe-inline' styles: React renders a <style> element and inline style props.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    server_tokens off;

    # Same as Vite dev proxy: browser calls /api/* → gateway container.
    location /api/ {
        # Allow burst of 10 requests, then enforce rate. Returns 429 when exceeded.
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        # Photos are downscaled in the browser; 10 MB covers base64 + JSON overhead.
        client_max_body_size 10m;
        # Stream answer tokens to the browser as they arrive (NDJSON), not in batches.
        proxy_buffering off;

        set $gateway_upstream gateway:8000;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA: serve built React files; fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
